name: MyGIt Design Theme Checks

on:
  push:
    branches: [mygit]
    paths:
      - 'mygit-themes/**'
      - '.github/workflows/mygit-design.yml'
  pull_request:
    branches: [mygit]
    paths:
      - 'mygit-themes/**'
      - '.github/workflows/mygit-design.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  macos-design:
    name: Mac build and layout compatibility
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - name: Check out upstream-compatible product branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run pure-Python design theme tests
        run: python3 -m unittest discover -s mygit-themes/tools -p 'test_*.py'

      - name: Validate original six-screen design against this upstream baseline
        run: python3 mygit-themes/tools/theme.py check mygit-design

      - name: Configure .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Prepare independent MyGIt UI and platform icons
        run: python3 mygit-themes/tools/theme.py prepare mygit-design --output ../MyGIt-Design

      - name: Initialize independent build worktree submodules
        run: git -C ../MyGIt-Design submodule update --init --recursive

      - name: Compile the actual Avalonia application
        working-directory: ../MyGIt-Design
        run: dotnet build src/SourceGit.csproj -c Debug -p:DisableAOT=true

      - name: Publish self-contained Apple Silicon preview
        working-directory: ../MyGIt-Design
        run: |
          dotnet publish src/SourceGit.csproj \
            -c Release -r osx-arm64 --self-contained true \
            -p:DisableAOT=true -o build/SourceGit

      - name: Package and ad-hoc sign MyGIt design preview
        working-directory: ../MyGIt-Design
        run: |
          # Change identity only in the isolated build worktree. The system
          # SourceGit bundle and its user preferences must remain untouched.
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.buildhelpers.mygit" build/resources/app/App.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleName MyGIt" build/resources/app/App.plist
          export VERSION="$(cat VERSION)"
          export RUNTIME="osx-arm64"
          bash build/scripts/package.osx-app.sh
          mv build/SourceGit.app build/MyGIt.app
          codesign --verify --deep --strict --verbose=2 build/MyGIt.app
          (cd build && zip -qry MyGIt-Design-macOS-arm64.zip MyGIt.app)
          cp build/MyGIt-Design-macOS-arm64.zip "$RUNNER_TEMP/MyGIt-Design-macOS-arm64.zip"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" build/MyGIt.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleName" build/MyGIt.app/Contents/Info.plist

      - name: Upload macOS acceptance preview
        uses: actions/upload-artifact@v4
        with:
          name: MyGIt-Design-macOS-arm64
          path: ${{ runner.temp }}/MyGIt-Design-macOS-arm64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Keep the original upstream and product code untouched
        run: |
          test -z "$(git status --porcelain)"
          echo "Product branch tree is clean. All UI changes remain in the isolated worktree."
